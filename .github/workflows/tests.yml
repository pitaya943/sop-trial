# pitaya template 0.1.1 · .github/workflows/tests.yml
# Runs the project's test command on every pull request and on pushes to main.
# Make the "tests" check required on main (see the "protect main" recipe), so a
# pull request with failing tests can't merge.
# When to remove: never while tests are the definition of done; replace it with
# a fuller CI that still runs the same command.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest into the venv the test command uses
        run: python -m venv .venv && .venv/bin/pip install pytest
      # The harness's test command plus --junitxml, as every workflow runs it
      # (junit-xml, see docs/agents/harness.md). no-weakened-tests and done-when
      # compare these reports by test ID; this job only proves the report is written.
      - name: Run the test command from docs/agents/harness.md
        env:
          JUNIT: ${{ runner.temp }}/junit.xml
        run: |
          .venv/bin/python -m pytest -q --junitxml="$JUNIT"
          grep -q "<testcase" "$JUNIT"
